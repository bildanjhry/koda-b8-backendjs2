services:
  client:
    build:
      context: ./client
    ports:
      - 5173:80
  server:
    build:
      context: ./server
    ports:
      - 8080:8080
    depends_on:
      - database
  database:
    image: postgres:alpine
    container_name: pulse-app
    volumes:
      - postgres-data:/var/lib/postgres/data
    env_file:
      - .docker.env
    ports:
      - 5435:5432
volumes:
  postgres-data:
